<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Wallet base -->
  <rect x="96" y="148" width="320" height="232" rx="28" fill="none" stroke="url(#accent)" stroke-width="16"/>
  <!-- Wallet flap -->
  <path d="M124 148 V120 Q124 88 156 88 H356 Q388 88 388 120 V148" fill="none" stroke="url(#accent)" stroke-width="16" stroke-linecap="round"/>
  <!-- Card slot -->
  <rect x="296" y="224" width="80" height="56" rx="14" fill="url(#accent)" opacity="0.25"/>
  <circle cx="336" cy="252" r="12" fill="url(#accent)" opacity="0.6"/>
  <!-- Dollar sign -->
  <text x="210" y="310" font-family="Inter, -apple-system, sans-serif" font-weight="700" font-size="140" fill="url(#accent)" opacity="0.9">$</text>
</svg>
